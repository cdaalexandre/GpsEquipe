<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320"><style>text{font-family:Inter, 'Segoe UI', Arial, Helvetica, sans-serif}
.t{font-size:14px;fill:#2C2C2A}.th{font-size:14px;font-weight:600;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}
rect.box{fill:#F8F7F3;stroke:#888780;stroke-width:.8}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}.dash{stroke-dasharray:5 4}
.assoc{stroke:#5F5E5A;stroke-width:1}
.fronteira{fill:none;stroke:#5F5E5A;stroke-width:1;stroke-dasharray:7 5}
.ator circle,.ator line{stroke:#2C2C2A;stroke-width:1.4;fill:none}
.c-gray>rect,.c-gray>ellipse{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.9}.c-gray>.t,.c-gray>.th{fill:#2C2C2A}.c-gray>.ts{fill:#5F5E5A}
.c-purple>rect,.c-purple>ellipse{fill:#EEEDFE;stroke:#534AB7;stroke-width:.9}.c-purple>.t,.c-purple>.th{fill:#26215C}.c-purple>.ts{fill:#534AB7}
.c-teal>rect,.c-teal>ellipse{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.9}.c-teal>.t,.c-teal>.th{fill:#04342C}.c-teal>.ts{fill:#0F6E56}
.c-coral>rect,.c-coral>ellipse{fill:#FAECE7;stroke:#993C1D;stroke-width:.9}.c-coral>.t,.c-coral>.th{fill:#4A1B0C}.c-coral>.ts{fill:#993C1D}
.c-green>rect,.c-green>ellipse{fill:#EAF3DE;stroke:#3B6D11;stroke-width:.9}.c-green>.t,.c-green>.th{fill:#173404}.c-green>.ts{fill:#3B6D11}
.c-red>rect,.c-red>ellipse{fill:#FCEBEB;stroke:#A32D2D;stroke-width:.9}.c-red>.t,.c-red>.th{fill:#501313}.c-red>.ts{fill:#A32D2D}
</style><rect x="0" y="0" width="680" height="320" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="40" y="40" width="280" height="250" rx="16"/>
<text class="th" x="180" y="64" text-anchor="middle" dominant-baseline="central">v1 in-process</text>
<text class="ts" x="180" y="84" text-anchor="middle" dominant-baseline="central">Suporte termina 10/11/2026</text></g>
<g class="c-coral"><rect x="60" y="106" width="240" height="164" rx="12"/>
<text class="th" x="180" y="130" text-anchor="middle" dominant-baseline="central">Processo do host</text>
<text class="ts" x="180" y="150" text-anchor="middle" dominant-baseline="central">Runtime do Functions</text></g>
<rect class="box" x="80" y="186" width="200" height="56" rx="8"/>
<text class="th" x="180" y="204" text-anchor="middle" dominant-baseline="central">Código das funções</text>
<text class="ts" x="180" y="224" text-anchor="middle" dominant-baseline="central">Preso ao .NET do host</text>
<g class="c-gray"><rect x="360" y="40" width="280" height="250" rx="16"/>
<text class="th" x="500" y="64" text-anchor="middle" dominant-baseline="central">v2 isolated worker</text>
<text class="ts" x="500" y="84" text-anchor="middle" dominant-baseline="central">.NET independente do host</text></g>
<g class="c-coral"><rect x="380" y="106" width="240" height="56" rx="8"/>
<text class="th" x="500" y="124" text-anchor="middle" dominant-baseline="central">Processo do host</text>
<text class="ts" x="500" y="144" text-anchor="middle" dominant-baseline="central">Runtime do Functions</text></g>
<g class="c-purple"><rect x="380" y="206" width="240" height="64" rx="8"/>
<text class="th" x="500" y="228" text-anchor="middle" dominant-baseline="central">Processo worker</text>
<text class="ts" x="500" y="248" text-anchor="middle" dominant-baseline="central">Seu código, .NET 10</text></g>
<line x1="500" y1="162" x2="500" y2="204" class="arr" marker-end="url(#arrow)"/>
</svg>